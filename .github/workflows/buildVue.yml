# Lints, type-checks, tests and builds ships-vue-3d, then publishes the built
# site (dist/, zipped) as a GitHub release: `latest-snapshot` for PRs and
# main, `v<version>` (from metadata.properties) for main.

name: Vue

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    # Not `npm run lint`: that one applies fixes, which in CI would only hide
    # the problems instead of failing on them.
    - name: Lint
      run: |
        npx oxlint .
        npx eslint .

    - name: Test
      run: npm test

    # Type-checks and builds.
    - name: Build
      run: npm run build

    - name: Package
      run: cd dist && zip -r ../ships-vue-3d.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ships-vue-3d
        path: dist

    - name: Get version
      id: version
      run: echo "version=$(grep '^version=' metadata.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

    - name: Create snapshot
      if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-snapshot
        name: Latest Snapshot
        prerelease: true
        files: ships-vue-3d.zip

    - name: Create release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        files: ships-vue-3d.zip
